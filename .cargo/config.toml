# Windows：把 CRT 打进 exe，减少 vcruntime140.dll 等依赖
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Linux musl：完全静态链接，产物可在多数 x86_64 Linux 上直接运行
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[alias]
build-win = "build --release"
build-linux = "zigbuild --release --target x86_64-unknown-linux-musl"
